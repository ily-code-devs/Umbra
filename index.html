<section class="section-appearance">

                    <linearGradient id="sRay" x1="10" y1="9" x2="38" y2="39" gradientUnits="userSpaceOnUse"><stop stop-color="#FFD86B"/><stop offset=".55" stop-color="#FFC145"/><stop offset="1" stop-color="#F0972A"/></linearGradient>
                    <linearGradient id="sRim" x1="13" y1="13" x2="31" y2="33" gradientUnits="userSpaceOnUse"><stop stop-color="#FFFFFF" stop-opacity=".9"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>

                <circle cx="24" cy="24" r="10.8" stroke="url(#sRim)" stroke-width="1.5"/>
                <ellipse cx="19.8" cy="19.4" rx="4.6" ry="3.8" transform="rotate(-35 19.8 19.4)" fill="#FFFFFF" fill-opacity=".38"/>
            </svg>
            <svg class="icon-moon" width="48" height="48" viewBox="0 0 48 48" fill="none">
                <defs>
                    <linearGradient id="mBody" x1="9" y1="10" x2="34" y2="41" gradientUnits="userSpaceOnUse"><stop stop-color="#FFFFFF"/><stop offset=".35" stop-color="#F0EBFF"/><stop offset=".72" stop-color="#C7B8F2"/><stop offset="1" stop-color="#9C86E0"/></linearGradient>

        <div class="mode-buttons">
